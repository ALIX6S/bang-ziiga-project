name: bang_ziiga
description: Application mobile de tourisme local - Bãng Zĩiga
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestion d'état
  provider: ^6.1.1

  # Communication réseau
  http: ^1.1.0

  # Stockage local
  shared_preferences: ^2.2.2

  # UI et images
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0

  # Validation
  email_validator: ^2.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0

  # Génération d'icônes
  flutter_launcher_icons: ^0.13.1

# Configuration de l'icône de l'application
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#344C3D"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Polices personnalisées (si nécessaire)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700